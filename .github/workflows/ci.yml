name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore solution
        run: dotnet restore .\GlimHUD.slnx
      - name: Build solution
        run: dotnet build .\GlimHUD.slnx --configuration Release --no-restore
      - name: Run console and archive checks
        run: .\scripts\Test.ps1 -NoRestore -NoBuild
      - name: Check live theme layout and legacy appearance
        run: .\scripts\Test-Themes.ps1
