name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify tag matches project version
        run: |
          [xml] $project = Get-Content .\src\GlimHUD\GlimHUD.csproj
          $version = [string] $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'The tag must exactly match the project version.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore and build solution
        run: |
          dotnet restore .\GlimHUD.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build .\GlimHUD.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Run console and archive checks
        run: .\scripts\Test.ps1 -NoRestore -NoBuild
      - name: Fetch verified PresentMon
        run: .\scripts\Get-PresentMon.ps1
      - name: Publish self-contained Windows x64 build
        run: .\scripts\Publish.ps1 -SelfContained
      - name: Archive portable build and calculate checksum
        run: |
          New-Item -ItemType Directory -Path .\artifacts\release -Force | Out-Null
          $archive = ".\artifacts\release\GlimHUD-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path .\artifacts\GlimHUD-win-x64\* -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath .\artifacts\release\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-files
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-files
          path: release-files
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -LiteralPath release-files -File | ForEach-Object FullName)
          gh release create "$env:RELEASE_TAG" @files --verify-tag --title "GlimHUD $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
