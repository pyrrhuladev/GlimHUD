name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to publish (leave empty to use the project version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      release_tag: ${{ steps.release_info.outputs.release_tag }}
      release_commit: ${{ steps.release_info.outputs.release_commit }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Keep SDK 10 on runtime 10; let older tools use the next installed major.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify release prerequisites
        id: release_info
        env:
          NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          [xml] $project = Get-Content .\src\GlimHUD\GlimHUD.csproj
          $version = [string] $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'The project version must be stable and have three numeric components.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $expectedRef = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { "v$version" } else { "release/v$version" }
            if ($env:GITHUB_REF_NAME -cne $expectedRef) { throw 'The release tag or branch must exactly match the stable project version.' }
          }
          if ($env:REQUESTED_VERSION -and $env:REQUESTED_VERSION -cne $version) { throw 'The requested version must exactly match the project version.' }
          if ([string]::IsNullOrWhiteSpace($env:NETSPARKLE_PRIVATE_KEY)) { throw 'Configure the NETSPARKLE_PRIVATE_KEY Actions secret before publishing.' }
          if (-not (Test-Path -LiteralPath .\src\GlimHUD\Assets\update-public-key.txt)) { throw 'The pinned update public key is missing.' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "release_tag=v$version" >> $env:GITHUB_OUTPUT
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the checked-out source commit.' }
          "release_commit=$($sourceCommit.Trim())" >> $env:GITHUB_OUTPUT
      - name: Restore and build solution
        run: |
          dotnet restore .\GlimHUD.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build .\GlimHUD.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Run console and archive checks
        run: .\scripts\Test.ps1 -NoRestore -NoBuild
      - name: Install pinned NetSparkle signing tool
        run: |
          dotnet tool install NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0 --tool-path .tools/netsparkle-appcast
          if ($LASTEXITCODE -ne 0) { throw 'NetSparkle signing tool installation failed.' }
      - name: Test update feed signing and tamper rejection
        run: |
          python -m unittest discover -s tests -p test_update_feed.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Update feed checks failed.' }
      - name: Fetch verified PresentMon
        run: .\scripts\Get-PresentMon.ps1
      - name: Fetch verified official PawnIO installer
        run: .\scripts\Get-PawnIO.ps1
      - name: Publish self-contained Windows x64 build
        run: .\scripts\Publish.ps1 -SelfContained
      - name: Prepare verified Inno Setup compiler
        run: .\scripts\Get-InnoSetup.ps1
      - name: Build per-user installer
        run: .\scripts\Build-Installer.ps1 -InputDirectory .\artifacts\GlimHUD-win-x64 -OutputDirectory .\artifacts\release
      - name: Archive portable build
        run: |
          $archive = ".\artifacts\release\GlimHUD-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path .\artifacts\GlimHUD-win-x64\* -DestinationPath $archive
          Copy-Item -LiteralPath $archive -Destination .\artifacts\release\GlimHUD-win-x64.zip
      - name: Sign and verify installer and update metadata
        env:
          NETSPARKLE_PRIVATE_KEY: ${{ secrets.NETSPARKLE_PRIVATE_KEY }}
        run: |
          .\scripts\Build-UpdateFeed.ps1 -InstallerPath ".\artifacts\release\GlimHUD-$env:RELEASE_VERSION-Setup-x64.exe" -Version $env:RELEASE_VERSION -OutputDirectory .\artifacts\release
      - name: Calculate release checksums
        run: |
          $lines = Get-ChildItem -LiteralPath .\artifacts\release -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'artifacts/release/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-files
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-files
          path: release-files
      - name: Publish complete GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          $files = @(Get-ChildItem -LiteralPath release-files -File | ForEach-Object FullName)
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api "repos/$env:GH_REPO/git/refs" --method POST -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:RELEASE_COMMIT" --silent
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag for the exact build commit.' }
          }
          $tagCommit = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -cne $env:RELEASE_COMMIT) { throw 'The release tag points to another commit. Publish a new version.' }
          $existing = gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'A published release is immutable. Publish a new version instead.' }
            gh release upload "$env:RELEASE_TAG" @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Draft release asset upload failed.' }
          } else {
            gh release create "$env:RELEASE_TAG" @files --draft --verify-tag --title "GlimHUD $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          # Pages runs after this workflow succeeds; the feed cannot precede its installer.
